# CheeseShop TECH — Netlify build & routing config
# See OPERATIONS_MANUAL.md §5 (Deployment Pipeline)

[build]
  command = "npm run build"
  publish = "dist"

# Public build-time vars committed here (no secrets). The unsigned Cloudinary upload preset
# name is exposed in the client bundle by design, so it lives in version control — not the
# dashboard — so it can't get lost. VITE_CLOUDINARY_CLOUD stays a site-level dashboard var.
[build.environment]
  VITE_CLOUDINARY_UPLOAD_PRESET = "st_unsigned"

# Serverless functions (Cloudinary media list, CRM/Make proxy). Secrets stay server-side.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# LEGACY: the Brand Systems Engine's old public path (retired 2026-07-02 — the engine is now
# integrated in-app behind the gate). Bookmarks/muscle memory land at the gated portal page.
[[redirects]]
  from = "/tools/brand-systems-engine/*"
  to = "/?app=1&page=brand-systems"
  status = 302

# SPA routing — all paths resolve to the React shell so client-side routing works.
# (Netlify serves /.netlify/functions/* before this catch-all.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
