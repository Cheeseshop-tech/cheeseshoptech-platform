<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/cstech-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CheeseShop TECH</title>
    <!-- House fonts. Client fonts (from the allowlist) are loaded on demand by the theme injector. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Netlify Forms detection (build-time crawler only — never rendered/interactive). The real
         form lives in React (src/components/auth/request-access.jsx) and submits here via fetch,
         the documented pattern for SPA + Netlify Forms. Field names MUST match exactly.
         Enable email notifications for this form in Netlify: Site settings -> Forms ->
         Form notifications -> Add notification -> Email notification -> admin@cheeseshoptech.com. -->
    <form name="access-request" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <input type="text" name="role" />
      <input type="text" name="tenant" />
      <textarea name="note"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
