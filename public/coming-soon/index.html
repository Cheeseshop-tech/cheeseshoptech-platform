<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CheeseShop TECH</title>
  <style>
    :root { --bg:#1a1410; --fg:#f5efe6; --accent:#C9A227; }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:#1a1410; color:#f5efe6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      text-align:center; padding:2rem;
    }
    .wrap { max-width:34rem; }
    h1 { font-size:2rem; letter-spacing:.02em; margin:0 0 .75rem; }
    .accent { color:#C9A227; }
    p { color:#cfc4b4; line-height:1.6; margin:0; }
    .tag { margin-top:1.5rem; font-size:.8rem; letter-spacing:.18em; text-transform:uppercase; color:#8a7f6e; }
    .login {
      position:fixed; right:1.25rem; bottom:1.25rem;
      font-size:.8rem; letter-spacing:.14em; text-transform:uppercase;
      color:#8a7f6e; text-decoration:none; border-bottom:1px solid transparent;
      transition:color .2s, border-color .2s;
    }
    .login:hover { color:#C9A227; border-color:#C9A227; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>CheeseShop <span class="accent">TECH</span></h1>
    <p>E-commerce storefronts for perishable &amp; specialty-food brands. Launching soon.</p>
    <div class="tag">Posada &amp; Co.</div>
  </main>
  <a class="login" href="/login">Log in</a>
</body>
</html>
